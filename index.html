<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Table - Horaezon</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-2">
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-4">
  <h1 class="text-2xl font-bold text-center mb-1">🏆 Horaezon League</h1>
  <p class="text-xs text-center text-gray-500 mb-4">Live table • Approved results only</p>

  <div class="flex justify-between mb-4 text-sm gap-2">
    <a href="submit.html" class="flex-1 bg-blue-600 text-white px-3 py-3 rounded text-center font-bold">+ Submit Score</a>
    <a href="admin.html" class="bg-gray-800 text-white px-3 py-3 rounded">Admin</a>
  </div>

  <div id="table" class="text-sm">Loading league table...</div>

  <div class="mt-6 border-t pt-3">
    <h3 class="font-bold text-sm mb-2">Recent Approved Results</h3>
    <div id="recent" class="text-xs space-y-1"></div>
  </div>

  <p class="text-[10px] text-gray-400 mt-4 text-center">Mobile friendly • Updates instantly after approval</p>
</div>

<script src="config.js"></script>
<script>
async function loadTable(){
  const { data, error } = await supabaseClient.from('league_table').select('*');
  if(error){
    document.getElementById('table').innerHTML = `<p class="text-red-500">Error: ${error.message}<br><br>Have you run the SQL from Step 1 in Supabase SQL Editor?</p>`;
    return;
  }
  if(!data || data.length===0){
    document.getElementById('table').innerHTML = `<p class="text-gray-500">No players yet. Add players in Supabase > Table Editor > players</p>`;
    return;
  }
  let html = `<table class="w-full"><tr class="border-b font-bold text-gray-600"><td class="py-2">#</td><td>Player</td><td>P</td><td>W</td><td>Pts</td></tr>`;
  data.forEach((row,i)=>{
    html += `<tr class="border-b"><td class="py-2.5">${i+1}</td><td class="font-medium">${row.name}</td><td>${row.matches_played||0}</td><td>${row.wins||0}</td><td class="font-bold text-blue-600">${row.points||0}</td></tr>`;
  });
  html += `</table>`;
  document.getElementById('table').innerHTML = html;
}

async function loadRecent(){
  const {data} = await supabaseClient.from('results').select('*, p1:player1_id(name), p2:player2_id(name)').eq('status','approved').order('created_at',{ascending:false}).limit(5);
  if(data){
    document.getElementById('recent').innerHTML = data.map(r=>`<div>${r.p1.name} ${r.player1_score}-${r.player2_score} ${r.p2.name}</div>`).join('') || 'No results yet';
  }
}

loadTable();
loadRecent();
</script>
</body>
</html>
