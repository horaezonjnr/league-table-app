<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Score</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-3">
<div class="max-w-md mx-auto bg-white p-4 rounded-lg shadow">
<h1 class="text-xl font-bold mb-1">Submit Result</h1>
<p class="text-xs text-gray-500 mb-4">Your result will go to pending until admin approves</p>

<form id="form" class="space-y-3">
  <div>
    <label class="text-xs font-bold">Player 1</label>
    <select id="p1" class="w-full border p-3 rounded bg-white" required><option>Loading players...</option></select>
  </div>

  <div class="flex gap-2">
    <input id="s1" type="number" min="0" placeholder="Score P1" class="w-1/2 border p-3 rounded" required>
    <input id="s2" type="number" min="0" placeholder="Score P2" class="w-1/2 border p-3 rounded" required>
  </div>

  <div>
    <label class="text-xs font-bold">Player 2</label>
    <select id="p2" class="w-full border p-3 rounded bg-white" required></select>
  </div>

  <div>
    <label class="text-xs font-bold">Screenshot Evidence (Required)</label>
    <input id="screenshot" type="file" accept="image/*" capture="environment" class="w-full border p-3 rounded bg-gray-50" required>
    <p class="text-[10px] text-gray-500 mt-1">Take a photo of the score screen - works great on Android</p>
  </div>

  <div>
    <label class="text-xs font-bold">Your Name (Who submitted?)</label>
    <input id="submitter" type="text" placeholder="e.g. John" class="w-full border p-3 rounded" required>
  </div>

  <button id="btn" class="w-full bg-blue-600 text-white p-4 rounded font-bold">Submit for Approval</button>
</form>

<div id="status" class="mt-3 text-sm text-center font-medium"></div>

<a href="index.html" class="block text-center mt-6 text-blue-600 text-sm py-2 border rounded">← Back to League Table</a>
</div>

<script src="config.js"></script>
<script>
async function loadPlayers(){
  const {data, error} = await supabaseClient.from('players').select('*').order('name');
  if(error){ alert("First add players in Supabase Table Editor"); return; }
  const opts = data.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  document.getElementById('p1').innerHTML = opts;
  document.getElementById('p2').innerHTML = opts;
}
loadPlayers();

document.getElementById('form').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.innerText = "Uploading screenshot...";
  status.innerText = "";

  try {
    const file = document.getElementById('screenshot').files[0];
    const fileName = Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9.]/g,'');

    const {error:upErr} = await supabaseClient.storage.from('screenshots').upload(fileName, file);
    if(upErr) throw upErr;

    const {data:{publicUrl}} = supabaseClient.storage.from('screenshots').getPublicUrl(fileName);

    status.innerText = "Saving result...";
    const {error} = await supabaseClient.from('results').insert({
      player1_id: document.getElementById('p1').value,
      player2_id: document.getElementById('p2').value,
      player1_score: parseInt(document.getElementById('s1').value),
      player2_score: parseInt(document.getElementById('s2').value),
      screenshot_url: publicUrl,
      submitted_by: document.getElementById('submitter').value,
      status: 'pending'
    });
    if(error) throw error;

    status.innerHTML = "<span class='text-green-600'>✅ Submitted! Waiting for admin approval. It will appear on league table after approval.</span>";
    e.target.reset();
  } catch(err){
    status.innerHTML = `<span class='text-red-600'>Error: ${err.message}</span>`;
  } finally {
    btn.disabled = false;
    btn.innerText = "Submit for Approval";
  }
});
</script>
</body>
</html>
